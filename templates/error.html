{% extends "base.html" %}

{% block title %}Error | RemoteRoost{% endblock %}

{% block content %}
<div class="text-center py-20">
    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-100 mb-6">
        <svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>
    <h2 class="text-3xl font-bold text-primary mb-4">Something Went Wrong</h2>
    <p class="text-secondary mb-8 max-w-md mx-auto">{{ message|default("An unexpected error occurred. Please try again.") }}</p>
    <a href="{{ url_for('home') }}" class="inline-block bg-primary text-white font-medium px-6 py-3 rounded-full hover:bg-gray-800 transition-colors shadow-md">
        ← Back to Homepage
    </a>
</div>
{% endblock %}
