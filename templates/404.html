{% extends "base.html" %}

{% block title %}404 - Not Found | RemoteRoost{% endblock %}

{% block content %}
<div class="text-center py-20">
    <h1 class="text-9xl font-black text-gray-200 mb-4">404</h1>
    <h2 class="text-3xl font-bold text-primary mb-4">Page Not Found</h2>
    <p class="text-secondary mb-8 max-w-md mx-auto">Oops! The cafe or page you're looking for seems to have vanished or never existed.</p>
    <a href="{{ url_for('home') }}" class="inline-block bg-primary text-white font-medium px-6 py-3 rounded-full hover:bg-gray-800 transition-colors shadow-md">
        ← Back to Homepage
    </a>
</div>
{% endblock %}
